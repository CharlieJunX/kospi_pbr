name: KOSPI PBR daily

on:
  push:
  schedule:
    - cron: '*/15 * * * *'
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kospi-pbr-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Publish PBR and send Telegram notification
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
          SITES_PUBLISH_TOKEN: ${{ secrets.SITES_PUBLISH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kospi_pbr_daily.py --publish --notify
